<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    h1 {
      color: white;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .game-wrapper {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
    }

    canvas {
      display: block;
      background: #1a1a2e;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .info {
      display: flex;
      gap: 40px;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: 500;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .info-label {
      font-size: 14px;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-value {
      font-size: 24px;
      font-weight: 700;
      color: #4ade80;
    }

    .controls {
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .controls-title {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .controls-text {
      opacity: 0.8;
    }

    .game-over {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 1000;
    }

    .game-over.active {
      display: flex;
    }

    .game-over-content {
      background: #1a1a2e;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      color: white;
    }

    .game-over-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #ff6b6b;
    }

    .game-over-score {
      font-size: 24px;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .game-over-score-value {
      color: #4ade80;
      font-weight: 700;
    }

    button {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      color: white;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(244, 114, 182, 0.4);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 SNAKE</h1>

    <div class="game-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="info">
      <div class="info-item">
        <div class="info-label">Score</div>
        <div class="info-value" id="score">0</div>
      </div>
      <div class="info-item">
        <div class="info-label">High Score</div>
        <div class="info-value" id="highScore">0</div>
      </div>
    </div>

    <div class="controls">
      <div class="controls-title">Use arrow keys or WASD to move</div>
      <div class="controls-text">Press SPACE to pause/resume</div>
    </div>
  </div>

  <div class="game-over" id="gameOverModal">
    <div class="game-over-content">
      <div class="game-over-title">Game Over!</div>
      <div class="game-over-score">Final Score: <span class="game-over-score-value" id="finalScore">0</span></div>
      <button onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameActive = true;
    let isPaused = false;
    let gameSpeed = 100;
    let frameCount = 0;

    document.getElementById('highScore').textContent = highScore;

    function generateFood() {
      let newFood;
      let isOnSnake;
      do {
        isOnSnake = false;
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        for (let segment of snake) {
          if (segment.x === newFood.x && segment.y === newFood.y) {
            isOnSnake = true;
            break;
          }
        }
      } while (isOnSnake);
      return newFood;
    }

    function update() {
      if (!gameActive || isPaused) return;

      direction = nextDirection;

      const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }

      // Self collision
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      // Food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        food = generateFood();
        gameSpeed = Math.max(50, gameSpeed - 0.5);
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid (optional, subtle)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= tileCount; i++) {
        const pos = i * gridSize;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }

      // Draw snake
      for (let i = 0; i < snake.length; i++) {
        const segment = snake[i];
        const isHead = i === 0;

        if (isHead) {
          ctx.fillStyle = '#4ade80';
          ctx.shadowColor = 'rgba(74, 222, 128, 0.5)';
          ctx.shadowBlur = 8;
        } else {
          const opacity = 1 - (i / snake.length) * 0.5;
          ctx.fillStyle = `rgba(74, 222, 128, ${opacity})`;
          ctx.shadowColor = 'none';
        }

        ctx.fillRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      }

      ctx.shadowColor = 'rgba(0, 0, 0, 0)';

      // Draw food
      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = 'rgba(255, 107, 107, 0.5)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.shadowColor = 'rgba(0, 0, 0, 0)';

      // Draw pause indicator
      if (isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 32px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    function endGame() {
      gameActive = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', highScore);
        document.getElementById('highScore').textContent = highScore;
      }
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverModal').classList.add('active');
    }

    function gameLoop() {
      frameCount++;
      if (frameCount * 16 >= gameSpeed) {
        update();
        frameCount = 0;
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Input handling
    document.addEventListener('keydown', (e) => {
      if (!gameActive) return;

      switch (e.key.toLowerCase()) {
        case 'arrowup':
        case 'w':
          if (direction.y === 0) {
            nextDirection = {x: 0, y: -1};
            e.preventDefault();
          }
          break;
        case 'arrowdown':
        case 's':
          if (direction.y === 0) {
            nextDirection = {x: 0, y: 1};
            e.preventDefault();
          }
          break;
        case 'arrowleft':
        case 'a':
          if (direction.x === 0) {
            nextDirection = {x: -1, y: 0};
            e.preventDefault();
          }
          break;
        case 'arrowright':
        case 'd':
          if (direction.x === 0) {
            nextDirection = {x: 1, y: 0};
            e.preventDefault();
          }
          break;
        case ' ':
          isPaused = !isPaused;
          e.preventDefault();
          break;
      }
    });

    gameLoop();
  </script>
</body>
</html>
